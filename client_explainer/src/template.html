<title>Workflow Composer Explainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interactive, layered walkthrough of the TCS Dynamic Agentic Workflow Composer for client and sales conversations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout concept: a layered system stack. The overview is the Composer drawn as seven horizontal layers;
   every page below it opens level by level (L1 → L2 → L3) on double-click. Look follows the Composer UI. */
:root {
  --bg: oklch(0.975 0.004 70);
  --surface: oklch(0.995 0.002 70);
  --surface-2: oklch(0.953 0.006 65);
  --fg: oklch(0.22 0.012 60);
  --muted: oklch(0.47 0.016 60);
  --line: oklch(0.32 0.012 60 / 0.13);
  --line-strong: oklch(0.32 0.012 60 / 0.26);
  --accent: oklch(0.6 0.19 36);
  --accent-ink: oklch(0.99 0.004 70);
  --accent-soft: oklch(0.94 0.035 45);
  --accent-text: oklch(0.5 0.17 36);
  --ok: oklch(0.52 0.12 155);
  --ok-soft: oklch(0.94 0.04 155);
  --ind: oklch(0.55 0.12 260);
  --ind-soft: oklch(0.94 0.03 260);
  --c-activity: oklch(0.56 0.17 15);
  --c-agent: oklch(0.6 0.13 70);
  --c-condition: oklch(0.55 0.1 200);
  --c-transform: oklch(0.5 0.02 60);
  --biz: oklch(0.6 0.19 36);
  --tech: oklch(0.55 0.1 200);
  --grid: oklch(0.32 0.012 60 / 0.045);
  --shadow: 0 1px 2px oklch(0.2 0.01 60 / 0.06), 0 8px 24px -12px oklch(0.2 0.01 60 / 0.18);
  --logo-filter: invert(1) brightness(0.25);
  --font-sans: "Rubik", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Space Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.13 0.002 60); --surface: oklch(0.175 0.003 60); --surface-2: oklch(0.215 0.004 60);
    --fg: oklch(0.94 0.008 70); --muted: oklch(0.7 0.014 65); --line: oklch(0.72 0.012 60 / 0.16); --line-strong: oklch(0.72 0.012 60 / 0.3);
    --accent: oklch(0.65 0.18 36); --accent-ink: oklch(0.985 0.006 70); --accent-soft: oklch(0.28 0.06 40); --accent-text: oklch(0.76 0.14 42);
    --ok: oklch(0.76 0.13 155); --ok-soft: oklch(0.27 0.05 155); --ind: oklch(0.78 0.1 260); --ind-soft: oklch(0.27 0.05 260);
    --c-activity: oklch(0.72 0.15 15); --c-agent: oklch(0.8 0.13 75); --c-condition: oklch(0.76 0.1 200); --c-transform: oklch(0.72 0.02 60);
    --biz: oklch(0.72 0.16 40); --tech: oklch(0.76 0.1 200); --grid: oklch(0.72 0.012 60 / 0.04);
    --shadow: 0 1px 2px oklch(0 0 0 / 0.4), 0 10px 30px -14px oklch(0 0 0 / 0.7); --logo-filter: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.13 0.002 60); --surface: oklch(0.175 0.003 60); --surface-2: oklch(0.215 0.004 60);
  --fg: oklch(0.94 0.008 70); --muted: oklch(0.7 0.014 65); --line: oklch(0.72 0.012 60 / 0.16); --line-strong: oklch(0.72 0.012 60 / 0.3);
  --accent: oklch(0.65 0.18 36); --accent-ink: oklch(0.985 0.006 70); --accent-soft: oklch(0.28 0.06 40); --accent-text: oklch(0.76 0.14 42);
  --ok: oklch(0.76 0.13 155); --ok-soft: oklch(0.27 0.05 155); --ind: oklch(0.78 0.1 260); --ind-soft: oklch(0.27 0.05 260);
  --c-activity: oklch(0.72 0.15 15); --c-agent: oklch(0.8 0.13 75); --c-condition: oklch(0.76 0.1 200); --c-transform: oklch(0.72 0.02 60);
  --biz: oklch(0.72 0.16 40); --tech: oklch(0.76 0.1 200); --grid: oklch(0.72 0.012 60 / 0.04);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.4), 0 10px 30px -14px oklch(0 0 0 / 0.7); --logo-filter: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
img { max-width: 100%; }
html { scroll-padding-top: 84px; }
body {
  background: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--fg); font-family: var(--font-sans); font-size: 15px; line-height: 1.55;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: inherit; }
code, .code, pre { font-family: var(--font-display); }
h1, h2, h3, h4, h5 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 4.2vw, 40px); line-height: 1.12; letter-spacing: -0.02em; }
h2 { font-family: var(--font-display); font-size: clamp(19px, 2.4vw, 23px); letter-spacing: -0.01em; }
h3 { font-size: 17px; font-weight: 600; }
h4 { font-size: 15px; font-weight: 600; }
h5 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; color: inherit; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in oklch, var(--surface) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
.brand img { height: 22px; width: auto; filter: var(--logo-filter); }
.brand-t { display: flex; flex-direction: column; line-height: 1.15; border-left: 1px solid var(--line-strong); padding-left: 12px; min-width: 0; }
.brand-t b { font-family: var(--font-display); font-size: 13px; letter-spacing: -0.01em; }
.brand-t small { color: var(--muted); font-size: 11px; }
.crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); flex: 1; min-width: 0; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { color: var(--fg); }
.crumbs strong { color: var(--fg); font-weight: 500; }
.ctrls { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.icon-btn { border: 1px solid var(--line-strong); background: transparent; border-radius: 8px; width: 32px; height: 30px; display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; }

main {
  max-width: 1200px; margin: 0 auto; outline: none;
  padding-block: 28px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 40px;
}
#main:focus, #main:focus-visible { outline: none; }
.hero .kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.eyebrow { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 10px; }
.lede { font-size: 17px; color: var(--muted); max-width: 68ch; margin-top: 12px; }
.tagline { font-family: var(--font-display); color: var(--accent-text); margin-top: 10px; font-size: 15px; }
.hero, .page-h { display: flex; flex-direction: column; }
.hero .kpis, .page-h .kpis { margin-top: 24px; }
.back { font-size: 13px; color: var(--muted); text-decoration: none; margin-bottom: 14px; }
.back:hover { color: var(--fg); }
.ph-row { display: flex; gap: 16px; align-items: center; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.kpi { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 30px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi-v { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi-l { font-size: 13px; color: var(--muted); line-height: 1.4; }
.kpi-i { border-style: dashed; border-color: color-mix(in oklch, var(--ind) 45%, transparent); }
.tag { position: absolute; left: 14px; bottom: 9px; font-family: var(--font-display); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; }
.calc-h .tag { position: static; }
.tag-m { background: var(--ok-soft); color: var(--ok); }
.tag-i { background: var(--ind-soft); color: var(--ind); }

/* sections */
.sec { display: flex; flex-direction: column; gap: 16px; }
.sec-h { display: flex; flex-direction: column; gap: 6px; }
.sec-h p { color: var(--muted); max-width: 72ch; }
.sec-n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font-size: 13px; margin-right: 10px; vertical-align: 3px; }

/* journeys */
.journeys { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.journey { display: flex; flex-direction: column; gap: 8px; text-decoration: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease; }
.journey:hover { transform: translateY(-2px); border-color: var(--accent); }
.j-k { font-family: var(--font-display); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-text); }
.j-t { font-size: 19px; font-weight: 600; line-height: 1.25; }
.j-p { color: var(--muted); font-size: 14px; }
.j-flow { display: flex; gap: 3px; height: 8px; margin-top: 8px; }
.j-flow i { display: block; border-radius: 2px; background: var(--accent); opacity: .85; }
.j-flow i:nth-child(even) { opacity: .5; }

/* the layer stack */
.stack { display: flex; flex-direction: column; gap: 8px; }
.band { display: grid; grid-template-columns: 240px 1fr; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.band-label { padding: 16px; background: var(--surface-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.band-n { font-family: var(--font-display); font-size: 11px; color: var(--accent-text); letter-spacing: .08em; }
.band-label p { font-size: 13px; color: var(--muted); line-height: 1.4; }
.band-tiles { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; }
.tile { flex: 1 1 200px; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; align-content: start; column-gap: 10px; row-gap: 2px; align-items: start; text-decoration: none; padding: 10px; border-radius: 8px; border: 1px solid transparent; transition: background .12s ease, border-color .12s ease; min-width: 0; }
.tile:hover, .tile:focus-visible { background: var(--accent-soft); border-color: color-mix(in oklch, var(--accent) 35%, transparent); }
.tile .code { grid-row: span 2; }
.tile-t { font-weight: 600; font-size: 14px; }
.tile-p { font-size: 12.5px; color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.code { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 7px; background: var(--fg); color: var(--bg); font-weight: 700; font-size: 13px; letter-spacing: -0.02em; flex: none; }
.code-lg { width: 56px; height: 56px; font-size: 20px; border-radius: 10px; }
.tile[data-band="foundation"] .code, .ph-row .code { background: var(--accent); color: var(--accent-ink); }

/* pitch + calc */
.pitch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.pitch { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.pitch p { color: var(--muted); font-size: 14px; }
.calc { background: var(--surface); border: 1px dashed color-mix(in oklch, var(--ind) 45%, transparent); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.calc-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.calc-note { color: var(--muted); font-size: 13px; }
.calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.calc label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.calc input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; font-variant-numeric: tabular-nums; width: 100%; }
.calc-out { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.calc-out div { background: var(--ind-soft); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; }
.calc-out span { font-family: var(--font-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ind); }
.calc-out small { color: var(--muted); }

/* business / technology views */
.views { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.view { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.view h4 { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
.view ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.view li, .view p { font-size: 14px; }
.view.biz { border-top: 3px solid var(--biz); }
.view.tech { border-top: 3px solid var(--tech); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot-biz { background: var(--biz); }
.dot-tech { background: var(--tech); }
body[data-lens="biz"] .view.tech, body[data-lens="tech"] .view.biz { display: none; }
body[data-lens="biz"] .views, body[data-lens="tech"] .views { grid-template-columns: 1fr; }
body[data-lens="biz"] .stage-tech { display: none; }

.cta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; text-decoration: none; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 16px 18px; }
.cta b { font-family: var(--font-display); }

/* level cards */
.lvlbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; }
.lvlbar-actions { display: flex; gap: 6px; }
.lvlbar button { border: 1px solid var(--line-strong); background: transparent; border-radius: 7px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.lvlbar button:hover { border-color: var(--accent); }
.lvls { display: flex; flex-direction: column; gap: 8px; }
.lvl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.lvl.open { border-color: var(--line-strong); box-shadow: var(--shadow); }
.lvl-h { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; padding: 12px 12px 12px 14px; cursor: zoom-in; user-select: none; -webkit-user-select: none; border-radius: var(--r); }
.lvl.open > .lvl-h { cursor: zoom-out; }
.lvl-h:hover { background: color-mix(in oklch, var(--accent-soft) 55%, transparent); }
.lvl-n { font-family: var(--font-display); font-size: 10px; color: var(--accent-text); border: 1px solid color-mix(in oklch, var(--accent) 40%, transparent); border-radius: 4px; padding: 1px 5px; }
.lvl-t { min-width: 0; }
.lvl-t h4 { font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lvl-t p { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.lvl-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.ms, .count { font-family: var(--font-display); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.count { color: var(--muted); }
.lvl-btn { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line-strong); background: transparent; display: grid; place-items: center; cursor: pointer; }
.lvl-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; transition: transform .15s ease; }
.lvl.open > .lvl-h .lvl-btn svg { transform: rotate(90deg); }
.lvl-b { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 12px; border-top: 1px dashed var(--line); padding-top: 12px; }
.lvl-2 > .lvl-b > .lvls { padding-left: 14px; border-left: 2px solid color-mix(in oklch, var(--accent) 30%, transparent); }
.lvl-3 { background: var(--bg); }
.lvl-inner { margin-left: 22px; }
.stage-i { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--fg); color: var(--bg); font-family: var(--font-display); font-size: 12px; }
.stage-tech { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.share { font-family: var(--font-display); font-size: 11px; color: var(--accent-text); }
.decided { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; padding: 10px 12px; }
.decided p { font-size: 14px; }
.pill { font-family: var(--font-display); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; border-radius: 4px; padding: 1px 6px; white-space: nowrap; border: 1px solid currentColor; }
.pill-tool { color: var(--c-activity); }
.pill-agent { color: var(--c-agent); }
.pill-condition { color: var(--c-condition); }
.pill-transform { color: var(--c-transform); }
.pill-c { color: var(--tech); font-size: 9.5px; }
.pill-ok { color: var(--ok); }
.goal { white-space: pre-wrap; font-size: 12.5px; line-height: 1.6; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin: 0; overflow-x: auto; }

/* timeline */
.timeline { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
.tl-seg { min-width: 86px; text-align: left; display: flex; flex-direction: column; gap: 2px; border: 0; border-top: 6px solid var(--accent); background: var(--surface); border-radius: 4px; padding: 8px; cursor: pointer; }
.tl-seg:nth-child(even) { border-top-color: color-mix(in oklch, var(--accent) 55%, var(--surface)); }
.tl-seg:hover { background: var(--accent-soft); }
.tl-i { font-family: var(--font-display); font-size: 11px; color: var(--muted); }
.tl-l { font-size: 12.5px; font-weight: 500; line-height: 1.25; }
.tl-ms { font-family: var(--font-display); font-size: 11.5px; color: var(--accent-text); }

/* screenshots */
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.gallery-1 { grid-template-columns: minmax(0, 900px); }
.shot { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.shot-btn { padding: 0; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; background: #0b0b0b; cursor: zoom-in; display: block; width: 100%; }
.shot img { display: block; width: 100%; height: auto; max-width: 100%; }
.shot-crop .shot-btn { max-height: 520px; overflow: hidden; }
.shot-crop img { object-fit: cover; object-position: top; }
.shot figcaption { font-size: 12.5px; color: var(--muted); }
.lvl-b .shot { max-width: 760px; }

/* built graph */
.built { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.graph-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow-x: auto; }
.graph { width: 100%; min-width: 520px; height: auto; display: block; }
.g-node rect { fill: var(--surface-2); stroke-width: 1.5; }
.g-activity rect { stroke: var(--c-activity); }
.g-agent rect { stroke: var(--c-agent); fill: color-mix(in oklch, var(--c-agent) 12%, var(--surface)); }
.g-condition rect { stroke: var(--c-condition); stroke-dasharray: 4 3; }
.g-transform rect { stroke: var(--c-transform); }
.g-id { font-family: var(--font-display); font-size: 12px; fill: var(--fg); }
.g-type { font-family: var(--font-sans); font-size: 10.5px; fill: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.g-edge { fill: none; stroke: var(--muted); stroke-width: 1.4; }

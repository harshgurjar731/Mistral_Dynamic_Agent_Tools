# Seed vocabulary.
#
# Deliberately small. A vocabulary of eight terms fully applied is worth more
# than sixty partially applied — retrieval that silently returns nothing is
# harder to debug than retrieval that returns too much. Grow this from real
# annotation gaps, not from speculation.
#
# Concept ids are dotted paths and must be globally unique. `parent` refers to
# another concept id in the same scheme.

schemes:
  - id: agent_tier
    label: Agent tier
    description: >-
      How broadly an agent applies. Drives the reuse policy the planner is
      instructed to follow.

  - id: domain
    label: Business domain
    description: >-
      The line of business a resource serves. The primary axis the planner
      narrows on before choosing agents.

  - id: capability
    label: Capability
    description: >-
      What a resource can do, or needs done. Agents require capabilities;
      tools and connectors provide them.

  - id: data_class
    label: Data class
    description: >-
      Sensitivity of the data flowing through a step. Governs what may reach a
      third-party connector.

concepts:
  # ── Agent tier — mirrors AgentTier in vocab.py ──────────────────────────
  - id: agent_tier.foundation
    scheme: agent_tier
    label: Foundation
    definition: Domain-agnostic safety, routing and quality gates. Always reused.
    synonyms: [guardrail, moderation, safety]

  - id: agent_tier.domain
    scheme: agent_tier
    label: Domain
    definition: Business logic shared across the products of one domain.

  - id: agent_tier.use_case
    scheme: agent_tier
    label: Use case
    definition: Product-specific logic for a single product type.

  # ── Domain ──────────────────────────────────────────────────────────────
  # The domain scheme lives in `industries.yaml`, which owns the whole
  # industry → domain → subdomain tree. Declaring a domain concept in two files
  # meant whichever loaded last silently won on label and definition, so this
  # scheme has exactly one owner.

  # ── Capability ──────────────────────────────────────────────────────────
  - id: capability.reasoning
    scheme: capability
    label: Reasoning
    definition: Pure model reasoning with no external system access.

  - id: capability.reasoning.assessment
    scheme: capability
    parent: capability.reasoning
    label: Assessment
    definition: Scoring, eligibility and risk judgements.

  - id: capability.reasoning.extraction
    scheme: capability
    parent: capability.reasoning
    label: Extraction
    definition: Pulling structured fields out of unstructured input.

  - id: capability.reasoning.summarisation
    scheme: capability
    parent: capability.reasoning
    label: Summarisation
    definition: Condensing or rewriting content.

  - id: capability.governance
    scheme: capability
    label: Governance
    definition: Safety, moderation and output quality gates.
    synonyms: [moderation, guardrail, review]

  - id: capability.retrieval
    scheme: capability
    label: Retrieval
    definition: Reading grounded knowledge — document libraries, web search.
    synonyms: [rag, search, lookup]

  - id: capability.integration
    scheme: capability
    label: Integration
    definition: Reading from or acting on an external system.

  - id: capability.integration.read
    scheme: capability
    parent: capability.integration
    label: External read
    definition: Reading data from a third-party service.

  - id: capability.integration.write
    scheme: capability
    parent: capability.integration
    label: External write
    definition: >-
      Creating or modifying state in a third-party service. Steps requiring
      this are the ones worth gating behind confirmation.

  - id: capability.computation
    scheme: capability
    label: Computation
    definition: Deterministic calculation, code execution or data transformation.
    synonyms: [calculation, code interpreter, transform]

  # ── Data class ──────────────────────────────────────────────────────────
  - id: data_class.public
    scheme: data_class
    label: Public
    definition: No restriction on where this data may travel.

  - id: data_class.internal
    scheme: data_class
    label: Internal
    definition: Organisation-internal. Should not leave without review.

  - id: data_class.financial
    scheme: data_class
    label: Financial
    definition: Account numbers, balances, credit data.

  - id: data_class.pii
    scheme: data_class
    label: Personal data
    definition: Identifies a person. Must not reach a third-party connector.
    synonyms: [personal, gdpr, sensitive]

# The shipped governance rules — reproduce the original four hand-coded
# checks exactly, so migrating to the rule engine changes nothing about
# validation behavior by default. All are seeded pre-approved: they governed
# every workflow before this table existed, and a silent downgrade to "draft"
# on upgrade would turn off egress checking without anyone deciding that.
#
# `severity` here is the fallback/default. capability_gap still computes its
# own severity per annotation provenance, same as it always did.

rules:
  - id: capability_gap.default
    kind: capability_gap
    label: Capability coverage
    severity: warning
    params: {}
    status: approved
    source: seed

  - id: egress.default
    kind: egress
    label: Restricted data egress
    severity: error
    params:
      restricted_data_classes: [pii, financial]
    status: approved
    source: seed

  - id: guardrail.default
    kind: guardrail
    label: Entry-step guardrail coverage
    severity: warning
    params:
      required_tier: foundation
    status: approved
    source: seed

  - id: library_domain.default
    kind: library_domain
    label: Library / domain match
    severity: warning
    params: {}
    status: approved
    source: seed

# Industry taxonomy — the three-level domain tree.
#
#   industry  →  domain  →  subdomain
#   bfsi      →  lending →  mortgage
#
# Level is *derived from depth*, not stored: a concept with no parent is an
# industry, its children are domains, theirs are subdomains. That keeps the
# hierarchy in one place (`parent_id`) instead of duplicating it in a column
# that can disagree with the tree.
#
# Concept ids already in use are re-declared here with a `parent` and nothing
# else changed. Ids are what annotations point at, so renaming one would orphan
# real review work — `domain.lending` stays `domain.lending` and simply gains
# `domain.bfsi` above it.
#
# Synonyms are what `matcher.score_concepts` matches a goal against, so they are
# written to be matched: real phrasings people use, not formal definitions. A
# synonym starting with `!` replaces the default phrase set rather than adding
# to it — use it when a label is an ordinary English word that would otherwise
# match everything.

concepts:

  # ══ BFSI ═════════════════════════════════════════════════════════════════

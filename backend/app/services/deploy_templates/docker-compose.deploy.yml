# Serves this workflow. Run `bootstrap_deploy.py` on the host first (it needs
# only `mistralai`/`httpx`/`python-dotenv` — no need to build an image for it).
#
#   docker compose -f docker-compose.deploy.yml up backend
#
# If this workflow uses dynamic tools or the knowledge graph, bring those up
# too (profiles keep this file identical across every package regardless of
# what a given workflow actually needs):
#
#   docker compose -f docker-compose.deploy.yml --profile tools up -d tool-service
#   docker compose -f docker-compose.deploy.yml --profile knowledge-graph up -d neo4j
#   docker compose -f docker-compose.deploy.yml up backend

services:
  backend:
    build: ./backend
    env_file: ./.env
    environment:
      WORKFLOWS_DIR: /mistral_workflows
      # .env's localhost URLs are for bootstrap_deploy.py on the host; inside
      # this container localhost is the container itself, so reach the sibling
      # services by compose name. Set BACKEND_TOOL_SERVICE_URL / BACKEND_NEO4J_URI
      # in .env to point at external instances instead.
      TOOL_SERVICE_URL: ${BACKEND_TOOL_SERVICE_URL:-http://tool-service:9000}
      NEO4J_URI: ${BACKEND_NEO4J_URI:-bolt://neo4j:7687}
    volumes:
      - ./mistral_workflows:/mistral_workflows
    restart: unless-stopped

  tool-service:
    build: ./tool-service
    profiles: ["tools"]
    ports:
      - "9000:9000"
    env_file: ./.env
    volumes:
      - tool-data:/app/dynamic_tools
      - tool-db:/app/db
      - tool-docs:/app/documents
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    profiles: ["knowledge-graph"]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/mistral-graph-rag}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    restart: unless-stopped

volumes:
  tool-data:
  tool-db:
  tool-docs:
  neo4j-data:
  neo4j-logs:
